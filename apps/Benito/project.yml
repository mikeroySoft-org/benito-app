name: Benito
options:
  bundleIdPrefix: org.example
  deploymentTarget:
    iOS: "18.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "16.0"
  developmentLanguage: en

packages:
  BenitoKit:
    path: ../../packages/BenitoKit

# Team id, bundle id prefix and Siri name live in Config/Base.xcconfig + Config/Local.xcconfig.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"

targets:
  Benito:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources
        createIntermediateGroups: true
        excludes:
          - Generated/GitSHA.swift
      # Generated by the "Embed Git SHA" pre-build script; gitignored, so it may not exist yet.
      - path: Sources/Generated/GitSHA.swift
        optional: true
        createIntermediateGroups: true
      - path: ../Shared
        createIntermediateGroups: true
      - path: Resources/Assets.xcassets
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Benito
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocalNetworkUsageDescription: >-
          Benito talks to your self-hosted Benito server on your LAN or tailnet so
          everyone in your family can sync feeds, diapers, and timers, and to find
          that server on your Wi-Fi during setup.
        NSBonjourServices:
          - _http._tcp
          - _benito._tcp
        # benito://join?p=… one-time family invites (Messages, AirDrop, QR code).
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER).invite
            CFBundleURLSchemes:
              - benito
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSSupportsLiveActivities: true
        # Lets Siri accept the child's name in place of "Benito" in App Shortcut phrases
        # ("Siri, Sam started a nap"). Set BENITO_SIRI_NAME in Config/Local.xcconfig.
        INAlternativeAppNames:
          - INAlternativeAppName: $(BENITO_SIRI_NAME)
    # SharePlay (Group Activities): Invite to Family over FaceTime / Messages / nearby iPhones.
    # Entitlements file comes from BENITO_ENTITLEMENTS (Config/*.xcconfig): the default has push +
    # SharePlay; Resources/Benito-UniversalLinks.entitlements adds applinks:benito.mikeroysoft.com,
    # which needs a team whose App ID has Associated Domains (see Config/Local.xcconfig.example).
    dependencies:
      - package: BenitoKit
        product: BenitoKit
      - target: BenitoWidgets
        embed: true
        codeSign: true
    preBuildScripts:
      - name: Embed Git SHA
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Sources/Generated/GitSHA.swift
        script: |
          set -euo pipefail
          ROOT="${SRCROOT}/../.."
          SHA="$(git -C "$ROOT" rev-parse --short HEAD 2>/dev/null || echo unknown)"
          OUT="${SRCROOT}/Sources/Generated/GitSHA.swift"
          mkdir -p "$(dirname "$OUT")"
          printf '%s\n' \
            "/// Short git SHA embedded at build time (see project.yml pre-build script)." \
            "enum BenitoGitSHA {" \
            "    static let short = \"${SHA}\"" \
            "}" > "$OUT"
      - name: Check TimelineView chrome
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          "${SRCROOT}/../../scripts/check-timer-chrome.sh"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BENITO_BUNDLE_PREFIX).benito
        PRODUCT_NAME: Benito
        CODE_SIGN_ENTITLEMENTS: $(BENITO_ENTITLEMENTS)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    scheme:
      gatherCoverageData: false

  # WidgetKit extension: Live Activity (Lock Screen, Dynamic Island, Apple Watch Smart Stack).
  # Embedded in Benito. Compiles apps/Shared (incl. the App Intents behind the activity's buttons).
  BenitoWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ../BenitoWidgets
        createIntermediateGroups: true
        excludes:
          - Info.plist
      - path: ../Shared
        createIntermediateGroups: true
    info:
      path: ../BenitoWidgets/Info.plist
      properties:
        CFBundleDisplayName: Benito
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    dependencies:
      - package: BenitoKit
        product: BenitoKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BENITO_BUNDLE_PREFIX).benito.widgets
        PRODUCT_NAME: BenitoWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

  # Stub watchOS target (not embedded — no watchOS simulator runtime on the dev Mac yet).
  BenitoWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ../BenitoWatch/Sources
        createIntermediateGroups: true
    dependencies:
      - package: BenitoKit
        product: BenitoKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BENITO_BUNDLE_PREFIX).benito.watchkitapp
        PRODUCT_NAME: BenitoWatch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Benito
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: $(BENITO_BUNDLE_PREFIX).benito
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES

schemes:
  Benito:
    build:
      targets:
        Benito: all
    run:
      config: Debug
    archive:
      config: Release

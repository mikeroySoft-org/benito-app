name: release-ios

on:
  push:
    tags: ["ios-v*"]

permissions:
  contents: read

concurrency:
  group: release-ios
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      - name: Install XcodeGen 2.46.0
        run: |
          set -euo pipefail
          curl -sL "https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip" -o /tmp/xcodegen.zip
          rm -rf /tmp/xcodegen
          unzip -q /tmp/xcodegen.zip -d /tmp
          sudo env PREFIX=/usr/local /tmp/xcodegen/install.sh
          xcodegen --version

      - name: Write official Local.xcconfig
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          BENITO_BUNDLE_PREFIX: ${{ vars.BENITO_BUNDLE_PREFIX }}
          BENITO_BUNDLE_ID: ${{ vars.BENITO_BUNDLE_ID }}
        run: |
          set -euo pipefail
          test -n "${APPLE_TEAM_ID}" || { echo "Set repository variable APPLE_TEAM_ID." >&2; exit 1; }
          prefix="${BENITO_BUNDLE_PREFIX:-}"
          if [[ -z "$prefix" && "${BENITO_BUNDLE_ID:-}" == *.benito ]]; then
            prefix="${BENITO_BUNDLE_ID%.benito}"
          fi
          test -n "$prefix" || { echo "Set repository variable BENITO_BUNDLE_PREFIX, or BENITO_BUNDLE_ID ending in .benito." >&2; exit 1; }
          printf '%s\n' \
            "DEVELOPMENT_TEAM = ${APPLE_TEAM_ID}" \
            "BENITO_BUNDLE_PREFIX = ${prefix}" \
            "BENITO_ENTITLEMENTS = Resources/Benito-UniversalLinks.entitlements" \
            > apps/Benito/Config/Local.xcconfig

      - name: Import App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "${ASC_KEY_P8}" || { echo "Set release secret ASC_KEY_P8 (base64 of the .p8 file)." >&2; exit 1; }
          printf '%s' "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          test -s "$RUNNER_TEMP/AuthKey.p8"

      - name: Import iOS Distribution certificate if provided
        env:
          P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${P12_BASE64}" ]]; then
            echo "No IOS_DISTRIBUTION_P12 secret; using automatic / cloud-managed signing with the API key."
            exit 0
          fi
          test -n "${P12_PASSWORD}" || { echo "IOS_DISTRIBUTION_P12 is set, but IOS_DISTRIBUTION_P12_PASSWORD is empty." >&2; exit 1; }
          umask 077
          keychain="$RUNNER_TEMP/release-ios.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/ios-distribution.p12"
          security import "$RUNNER_TEMP/ios-distribution.p12" -P "$P12_PASSWORD" \
            -f pkcs12 -k "$keychain" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$RUNNER_TEMP/ios-distribution.p12"
          echo "Imported iOS Distribution certificate into a temporary keychain."

      - name: Archive and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: |
          set -euo pipefail
          test -n "${ASC_KEY_ID}" || { echo "Set release secret ASC_KEY_ID." >&2; exit 1; }
          test -n "${ASC_ISSUER_ID}" || { echo "Set release secret ASC_ISSUER_ID." >&2; exit 1; }
          echo "Uploading to App Store Connect / TestFlight. This workflow does not submit for App Store review."
          scripts/release-ios.sh

      - name: Remove credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/ios-distribution.p12"
          security delete-keychain "$RUNNER_TEMP/release-ios.keychain-db" || true

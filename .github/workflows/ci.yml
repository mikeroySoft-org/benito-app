name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: cargo-${{ runner.os }}-${{ hashFiles('server/Cargo.lock') }}
      - name: cargo test
        working-directory: server
        env:
          BENITO_BONJOUR: "0"
        run: cargo test --locked

  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: BenitoKit tests
        working-directory: packages/BenitoKit
        run: swift test
      - name: Timer chrome lint
        run: ./scripts/check-timer-chrome.sh
      - name: Generate project
        working-directory: apps/Benito
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for Simulator (no signing team)
        working-directory: apps/Benito
        run: |
          xcodebuild build \
            -project Benito.xcodeproj -scheme Benito \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM= \
            | tail -n 50
